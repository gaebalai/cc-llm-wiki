name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate (JSON · SKILL · syntax · secret · lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ───── 1. JSON 유효성 ─────
      - name: JSON validity (plugin·marketplace·settings)
        run: |
          for f in \
            .claude-plugin/marketplace.json \
            .claude-plugin/plugin.json \
            .claude/settings.json
          do
            python -c "import json; json.load(open('$f'))" \
              && echo "  ✓ $f" \
              || (echo "  ✗ $f"; exit 1)
          done

      # ───── 2. plugin.json/marketplace.json 교차참조 ─────
      - name: Plugin ↔ Marketplace cross-ref
        run: |
          mp=$(python -c "import json; print(json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['name'])")
          pl=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['name'])")
          [ "$mp" = "$pl" ] && echo "  ✓ name 일치: $pl" || (echo "  ✗ name 불일치"; exit 1)
          mpv=$(python -c "import json; print(json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['version'])")
          plv=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          [ "$mpv" = "$plv" ] && echo "  ✓ version 일치: $plv" || (echo "  ✗ version 불일치 mp=$mpv pl=$plv"; exit 1)

      # ───── 3. SKILL.md frontmatter ─────
      - name: SKILL.md frontmatter
        run: |
          python << 'PY'
          import re, sys
          from pathlib import Path
          required = {"name", "description"}
          errs = 0
          for p in Path("skills").rglob("SKILL.md"):
              text = p.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  print(f"  ✗ {p} frontmatter 없음"); errs += 1; continue
              end = text.find("\n---\n", 4)
              fm = text[4:end] if end > 0 else ""
              keys = set(re.findall(r"^([a-zA-Z_-]+):", fm, re.M))
              missing = required - keys
              if missing:
                  print(f"  ✗ {p} 필수키 누락: {missing}"); errs += 1
              else:
                  print(f"  ✓ {p}")
          sys.exit(0 if errs == 0 else 1)
          PY

      # ───── 4. Bash syntax ─────
      - name: Bash syntax (install.sh)
        run: bash -n scripts/install.sh && echo "  ✓ install.sh"

      # ───── 5. Python compile ─────
      - name: Python compile
        run: |
          for p in services/graph/ingest_graph.py services/graph/query_graph.py scripts/post_slack.py; do
            python -m py_compile "$p" && echo "  ✓ $p"
          done

      # ───── 6. install.sh --check (사이드이펙트 0) ─────
      - name: install.sh --check (no Docker/Obsidian)
        run: |
          # CI 환경엔 brew/Docker/Obsidian 없음. STEP 1 까지만 확인
          bash scripts/install.sh --step 1 --check 2>&1 | tail -20 || true
          # 전체는 step 2 의 brew 분기에서 실패할 수 있음 → step 1 통과만 확인

      # ───── 7. lint Skill (vault 자체 정합성, 10 항목) ─────
      - name: vault lint (10 rules)
        run: |
          python << 'PY'
          import re, sys
          from pathlib import Path
          vault = Path("vault")
          if not vault.exists():
              print("  vault/ 없음 — skip (plugin packaging context)"); sys.exit(0)
          errs = 0; warns = 0
          seen_ids = {}
          # wikilink slug 매핑: short slug 와 full stem 둘 다 (v0.3.10+)
          slug_to_file = {}
          for p in vault.rglob("*.md"):
              if p.name.startswith("."): continue
              slug_to_file[p.stem] = p     # full stem
              m = re.match(r'^\d{4}-\d{2}-\d{2}-(.+)$', p.stem)
              if m: slug_to_file[m.group(1)] = p   # short slug (날짜 prefix 제거)

          for p in vault.rglob("*.md"):
              ps = str(p)
              # raw 본문 검사 안 함 (SCHEMA §5 항목 8 = WARN-RAW 만), lint 리포트 디렉터리 제외
              if "_lint" in ps or "01_raw" in ps or p.name.startswith("."): continue
              text = p.read_text(encoding="utf-8")
              if not text.startswith("---\n"): continue
              end = text.find("\n---\n", 4)
              fm = text[4:end] if end > 0 else ""
              keys = dict(re.findall(r"^([a-z_]+):\s*(.*)$", fm, re.M))
              t = keys.get("type", "")
              # dashboard, positioning 같은 비-편찬 타입은 frontmatter 필수키 면제
              if t in ("dashboard", "positioning"):
                  continue
              # 4 enum (topic/decision/self/digest) 만 필수키 검사
              for req in ("id","type","status","locale","sources","updated_at"):
                  if req not in keys: print(f"  ✗ {p} 필수키 누락: {req}"); errs += 1
              if t and t not in ("topic","decision","self","digest"):
                  print(f"  ✗ {p} type enum: {t}"); errs += 1
              s = keys.get("status","")
              if s and s not in ("draft","reviewed","published"):
                  print(f"  ✗ {p} status enum: {s}"); errs += 1
              iid = keys.get("id","")
              if iid:
                  if iid in seen_ids: print(f"  ✗ dup id: {iid}"); errs += 1
                  seen_ids[iid] = p
              # wikilink stem/short 둘 다 매칭 (v0.3.10+, _drafts/ 는 WARN-DRAFT 강등)
              is_draft = "_drafts" in ps
              for m in re.finditer(r'\[\[([a-z0-9-]+)\]\]', text):
                  link = m.group(1)
                  if link not in slug_to_file:
                      if is_draft:
                          print(f"  ⚠ WARN-DRAFT: {p.name} → [[{link}]]"); warns += 1
                      else:
                          print(f"  ✗ broken wikilink: {p.name} → [[{link}]]"); errs += 1
          print(f"\nERROR: {errs} / WARN: {warns}")
          sys.exit(0 if errs == 0 else 1)
          PY

      # ───── 8. 시크릿 leak grep (tracked 파일) ─────
      - name: Secret pattern grep (tracked only)
        run: |
          if git ls-files | xargs grep -lE 'xox[abeops]-[A-Za-z0-9-]{20,}|sk-[a-zA-Z0-9_-]{30,}|bot[A-Z0-9]{24}' 2>/dev/null \
             | grep -vE '\.env\.example$|SKILL\.md$|install\.(sh|md)$|raw/articles' ; then
            echo "  ✗ 실제 시크릿 패턴 의심"; exit 1
          else
            echo "  ✓ 시크릿 누출 없음"
          fi

      # ───── 9. .env 보호 ─────
      - name: .env gitignore protection
        run: |
          git check-ignore .env 2>/dev/null && echo "  ✓ .env ignored" \
            || (echo "  ⚠ .env 가 git 에 추적될 수 있음"; true)

      # ───── 10. eval rule vs gold (v0.4.2+) ─────
      - name: Extraction eval (rule vs gold)
        run: |
          if [ -d vault/03_schema/eval-gold ] && [ "$(ls vault/03_schema/eval-gold/*.yaml 2>/dev/null)" ]; then
            python services/graph/eval.py --all --mode rule --env .env.example
            # CI 환경 정답셋 통과 기준: 평균 F1 ≥ 0.9 권장 (현재는 통과 여부만)
          else
            echo "  vault/03_schema/eval-gold/ 비어있음 — skip"
          fi
